@font-face{font-family:Sirwan;src:url(UniSIRWAN_Swissra_Bold.ttf) format(&quot;truetype&quot;);font-weight:100 900}
:root{--ac:#38bdf8;--gap:16px;--f:Speda;--bg:#0a0e27;--cd:#131a43;--tx:#e8ecff;--mu:#8e98c9;--bd:#26307a;--pu:#8b5cf6}
[data-t=light]{--bg:#eef1fb;--cd:#fff;--tx:#141a3d;--mu:#5a6491;--bd:#d3d9f0}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--f),Tahoma,sans-serif;display:flex;min-height:100vh;line-height:1.7}
#sb{width:230px;flex:none;background:var(--cd);border-inline-end:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
#sb h2{font-size:1.15rem;padding:6px 10px 16px;background:linear-gradient(90deg,var(--ac),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
#nav button{display:flex;gap:10px;width:100%;text-align:start}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--bd);transition:.2s}
button:hover{filter:brightness(1.2)}
button.on,.pb{background:linear-gradient(135deg,var(--ac),var(--pu));color:#fff}
#nav button{background:none;margin-bottom:4px}#nav button.on{box-shadow:0 0 14px color-mix(in srgb,var(--ac) 50%,transparent)}
main{flex:1;min-width:0;padding:var(--gap)}
header{display:flex;align-items:center;gap:12px;margin-bottom:var(--gap)}header h1{font-size:1.4rem}
#mb{display:none}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}input[type=range]{padding:0;accent-color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--gap)}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:var(--gap);margin-bottom:var(--gap)}.g>.c{margin:0}
.c h3{margin-bottom:10px}.w2{grid-column:1/-1}
.mu,small{color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}.row>input[type=text],.row>input:not([type]){flex:1;min-width:120px}
.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.it.dn b{text-decoration:line-through;opacity:.55}
.gr{flex:1;min-width:0}.ib{padding:4px 8px;background:none}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--pu));transition:width .5s}
.big{font-size:2.6rem;line-height:1.2}
.bars{display:flex;gap:6px;height:170px}.bc{flex:1;display:flex;flex-direction:column;align-items:center}.bw{flex:1;display:flex;align-items:flex-end;width:100%}
.b{width:100%;background:linear-gradient(180deg,var(--ac),var(--pu));border-radius:6px 6px 0 0;min-height:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--gap)}.chip{padding:6px 12px}
.sw{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid transparent}.sw.on{border-color:var(--tx)}
.tm{font-size:5rem;text-align:center;direction:ltr}
.vw{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000}iframe.pdf{aspect-ratio:auto;height:75vh}
video.vw{max-height:70vh}
.th{width:96px;height:54px;object-fit:cover;border-radius:8px;background:var(--bd)}
#toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--cd);border:1px solid var(--ac);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:9}#toast.s{opacity:1}
#pg>*{animation:fi .3s}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.na *{transition:none!important;animation:none!important}
@media(max-width:800px){#sb{position:fixed;right:0;z-index:8;transform:translateX(100%);transition:.25s}#sb.open{transform:none}#mb{display:block}.tm{font-size:3.6rem}}

const def=()=>({set:{theme:'dark',ac:ACC[0],font:'Speda',fs:16,gap:16,anim:1,work:50,brk:10,goal:360,remind:0,hide:[]},start:T(),
 subjects:['ئینگلیزی','بیرکاری','فیزیا','کیمیا','زیندەوەزانی','عەرەبی','کوردی','پەروەردەی ئیسلامی'].map(n=>({id:uid(),name:n,goal:0})),

const db=new Promise((ok,no)=>{if(!window.indexedDB)return no();const r=indexedDB.open('sp12',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});

const mins=t=>{const[h,m]=t.split(':');return h*60+ +m},dur=x=>Math.max(0,mins(x.e)-mins(x.s)),dk=(d,id)=>d+'|'+id;

const ytId=u=>{try{const x=new URL(u.trim()),h=x.hostname.replace(/^www\.|^m\./,'');let id='';

<iframe id="f2" allow="fullscreen;autoplay;clipboard-write" srcdoc="<!DOCTYPE html>

<html dir=&quot;rtl&quot; lang=&quot;ckb&quot;>
<head>
<meta charset=&quot;utf-8&quot;/>
<meta content=&quot;width=device-width, initial-scale=1.0&quot; name=&quot;viewport&quot;/>
<title>Grade 12 Planner | کوردی سۆرانی</title>
<style>
:root{--bg:#0b0e14;--card:#151922;--blue:#00f0ff;--purple:#7000ff;--border:#2a3245;--muted:#9ca3af}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#e2e8f0;font-family:Tahoma,&quot;Segoe UI&quot;,Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% -10%,#260052 0,#0b0e14 42%)}
.glow{box-shadow:0 0 14px #00f0ff3d}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.blue{color:var(--blue);text-shadow:0 0 10px #00f0ff66}
.purple{color:#b873ff;text-shadow:0 0 10px #7000ff88}
.muted{color:var(--muted)}
.btn{border:0;border-radius:9px;padding:10px 16px;color:#fff;font-weight:700}
.btn-glow{background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 0 12px #00f0ff33}
.btn-dark{background:#202634;border:1px solid var(--border);color:#d1d5db}
.btn-red{background:#4a1729;border:1px solid #7d2946;color:#fecdd3}
input,select,textarea{width:100%;background:#202634;color:#e5e7eb;border:1px solid var(--border);border-radius:9px;padding:10px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 1px #00f0ff33}
textarea{resize:vertical}
.header{position:sticky;top:0;z-index:40;text-align:center;padding:16px;background:linear-gradient(#1e0040e8,#0b0e14e8);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.header h1{margin:0;font-size:28px}
.header p{margin:4px 0;font-size:13px}
.notice{display:inline-block;margin-top:8px;padding:5px 12px;border:1px solid #7c2bd055;background:#7000ff12;border-radius:9px;font-size:12px;color:var(--blue)}
#clock{font-size:28px;font-weight:900;color:#00f0ff;margin-top:10px;padding:10px 18px;border:2px solid #00f0ff66;border-radius:14px;background:#07131c;display:inline-block;min-width:300px;letter-spacing:.7px;line-height:1.35;box-shadow:0 0 20px #00f0ff33;text-shadow:0 0 10px #00f0ff88}
main{width:min(920px,calc(100% - 28px));margin:18px auto 80px}
.tab{display:none;animation:fade .25s ease}.tab.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.stack>*{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#111722;border:1px solid var(--border);border-radius:10px;padding:13px;text-align:center}
.stat b{display:block;font-size:24px;margin-top:3px}
.progress{height:13px;background:#202634;border:1px solid var(--border);border-radius:20px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--blue));transition:.3s}
.timer{font-size:65px;font-weight:900;text-align:center;margin:20px 0}
.center{text-align:center}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.small{font-size:12px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#111722;border:1px solid var(--border);border-radius:9px;padding:10px;margin:7px 0}
.task.done{opacity:.45;text-decoration:line-through}
.task input{width:auto}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--border);padding:9px;text-align:right}
th{color:var(--blue)}
.level{font-size:55px;font-weight:900;color:#b28aff;text-align:center}
.nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px auto;padding:0 12px}
.nav button{background:transparent;border:0;color:#8f98a8;padding:9px 10px;border-radius:8px;font-weight:700}
.nav button.active,.nav button:hover{color:var(--blue);background:#101923}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#0f131c;border-top:1px solid var(--border);display:none;overflow-x:auto}

<script>
&quot;use strict&quot;;
const $=id=>document.getElementById(id);
const KEY=&quot;grade12_offline_exact_style_v4&quot;;
const OWNER_CODE=&quot;JIN-7K4P-92MX-WOO&quot;;
const ACTIVE_PROFILE_KEY=&quot;grade12_active_profile_v2&quot;;
let profileCode=(localStorage.getItem(ACTIVE_PROFILE_KEY)||&quot;&quot;).trim();
function profileStorageKey(code){return KEY+&quot;__profile__&quot;+(code||&quot;guest&quot;).replace(/[^A-Za-z0-9_-]/g,&quot;_&quot;).slice(0,100)}
function defaultState(){return {study:0,xp:0,tasks:[],qSolved:0,qTarget:1000,notes:[],schedule:null,device:null,userName:&quot;&quot;,userCode:&quot;&quot;,language:&quot;ckb&quot;,taskReminders:[]}}
let legacyState=null;try{legacyState=JSON.parse(localStorage.getItem(KEY)||&quot;null&quot;)}catch(e){legacyState=null}
let state=profileCode?(JSON.parse(localStorage.getItem(profileStorageKey(profileCode))||&quot;null&quot;)||defaultState()):(legacyState||defaultState());
state.taskReminders=state.taskReminders||[];state.userCode=state.userCode||profileCode||&quot;&quot;;
function migrateRemovedSubject(v){return v===&quot;کۆمپیوتەر&quot;?&quot;گشتی&quot;:v}
if(Array.isArray(state.tasks))state.tasks.forEach(t=>{t.subject=migrateRemovedSubject(t.subject)});
if(state.schedule)state.schedule.forEach(r=>[&quot;sun&quot;,&quot;mon&quot;,&quot;tue&quot;,&quot;wed&quot;,&quot;thu&quot;].forEach(d=>{r[d]=migrateRemovedSubject(r[d])}));
if(state.curSubj===&quot;کۆمپیوتەر&quot;)state.curSubj=&quot;گشتی&quot;;
if(state.day!==tdy()){state.day=tdy();state.study=0;if(Array.isArray(state.tasks))state.tasks.forEach(t=>{if(t.kind===&quot;daily&quot;){t.done=false;t.lastDoneDay=&quot;&quot;}})}
state.language=&quot;ckb&quot;;
state.adhan=state.adhan||{enabled:true,times:{fajr:&quot;05:00&quot;,dhuhr:&quot;12:00&quot;,asr:&quot;15:30&quot;,maghrib:&quot;18:00&quot;,isha:&quot;19:30&quot;},last:{}};
state.bk=state.bk||{xp:{},open:{},done:{}};state.bk.topics=state.bk.topics||{};state.bk.exp=state.bk.exp||{};state.hist=state.hist||{};state.streak=state.streak||{last:&quot;&quot;,count:0,best:0};state.curSubj=state.curSubj||&quot;گشتی&quot;;state.mist=state.mist||[];state.badges=state.badges||{};state.qz=state.qz||{st:{}};state.qz.st=state.qz.st||{};
let timerSeconds=1500,timerMode=&quot;study&quot;,timerInterval=null;
let audioURL=null,ambient=null,focusCtx=null,focusNodes=[],focusTimer=null,focusMaster=null,focusVolume=0.25;

function save(){
 try{checkBadges()}catch(e){}
 try{
  localStorage.setItem(profileStorageKey(profileCode||&quot;guest&quot;),JSON.stringify(state));
  if($(&quot;backupInfo&quot;))$(&quot;backupInfo&quot;).textContent=&quot;✅ داتاکانت بە سەرکەوتوویی هەڵگیران.&quot;;
 }catch(e){
  try{localStorage.removeItem(KEY);localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e2){if($(&quot;backupInfo&quot;))$(&quot;backupInfo&quot;).textContent=&quot;⚠️ کێشەی هەڵگرتنی داتا هەیە.&quot;;toast(&quot;⚠️ پاشەکەوتکردن سەرکەوتوو نەبوو&quot;);return false}
 }
 try{renderAll()}catch(e){}
 return true;
}
function renderUserName(){if($(&quot;userNameBadge&quot;)) $(&quot;userNameBadge&quot;).textContent=state.userName?&quot;👤 &quot;+state.userName:&quot;👤 بەکارهێنەر&quot;}
function selectDevice(x){state.device=x;save();$(&quot;deviceModal&quot;).classList.add(&quot;hidden&quot;)}
// Device selection is disabled: the app is responsive automatically.
state.device = state.device || (window.innerWidth < 600 ? &quot;mobile&quot; : (window.innerWidth < 1000 ? &quot;tablet&quot; : &quot;desktop&quot;));
$(&quot;deviceModal&quot;).classList.add(&quot;hidden&quot;);

const OWNER_NOTICES_KEY=&quot;grade12_owner_notifications_v1&quot;;
function getOwnerNotifications(){try{const a=JSON.parse(localStorage.getItem(OWNER_NOTICES_KEY)||&quot;[]&quot;);return Array.isArray(a)?a:[]}catch(e){return []}}
function saveOwnerNotifications(a){try{localStorage.setItem(OWNER_NOTICES_KEY,JSON.stringify(a.slice(0,50)))}catch(e){} }
function ownerRequestNotificationPermission(){
  if(!window.Notification){toast(&quot;ℹ️ ئەم براوزەرە Notification پشتگیری ناکات&quot;);return}
  Notification.requestPermission().then(p=>{const el=$(&quot;ownerNoticeStatus&quot;);if(el)el.textContent=p===&quot;granted&quot;?&quot;✅ Notification چالاک کرا.&quot;:&quot;⚠️ مۆڵەتی Notification نەدرا.&quot;;}).catch(()=>{});
}
function ownerPushBrowserNotification(title,body){
  if(window.Notification &amp;&amp; Notification.permission===&quot;granted&quot;){
    try{new Notification(title,{body,tag:&quot;grade12-owner-notice&quot;})}catch(e){}
  }
}
function ownerSendNotification(){
  if(!state.isOwner){toast(&quot;🔒 تەنها Owner دەتوانێت ئاگاداری بنێرێت&quot;);return}
  const title=($(&quot;ownerNoticeTitle&quot;)?.value||&quot;&quot;).trim(),body=($(&quot;ownerNoticeBody&quot;)?.value||&quot;&quot;).trim();
  if(!title||!body){toast(&quot;⚠️ سەردێڕ و ناوەڕۆک پڕ بکەرەوە&quot;);return}
  const notice={id:&quot;notice_&quot;+Date.now()+&quot;_&quot;+Math.random().toString(36).slice(2,7),title,body,time:new Date().toISOString(),owner:OWNER_CODE};
  const all=getOwnerNotifications();all.unshift(notice);saveOwnerNotifications(all);
  if($(&quot;ownerNoticeTitle&quot;))$(&quot;ownerNoticeTitle&quot;).value=&quot;&quot;;if($(&quot;ownerNoticeBody&quot;))$(&quot;ownerNoticeBody&quot;).value=&quot;&quot;;
  ownerPushBrowserNotification(title,body);renderOwnerNotifications();renderUserNotifications();
  if($(&quot;ownerNoticeStatus&quot;))$(&quot;ownerNoticeStatus&quot;).textContent=&quot;✅ ئاگادارییەکە نێردرا و هەڵگیرا.&quot;;
  toast(&quot;📢 ئاگادارییەکە نێردرا&quot;);
}
function ownerTestNotification(){
  if(!state.isOwner)return toast(&quot;🔒 تەنها Owner دەتوانێت ئەمە بکات&quot;);
  ownerPushBrowserNotification(&quot;Grade 12 Planner&quot;,&quot;ئەمە تاقیکردنەوەی Notification ـی Owner ـە.&quot;);
  toast(window.Notification&amp;&amp;Notification.permission===&quot;granted&quot;?&quot;🔔 Notification ـی تاقیکردنەوە نێردرا&quot;:&quot;ℹ️ سەرەتا مۆڵەتی Notification چالاک بکە&quot;);
}
function ownerClearNotifications(){
  if(!state.isOwner)return toast(&quot;🔒 تەنها Owner دەتوانێت ئەمە بکات&quot;);
  if(!confirm(&quot;هەموو ئاگادارییەکان بسڕدرێنەوە؟&quot;))return;
  saveOwnerNotifications([]);renderOwnerNotifications();renderUserNotifications();toast(&quot;🗑️ هەموو ئاگادارییەکان سڕانەوە&quot;);
}
function renderUserNotifications(){
  const box=$(&quot;userNotifications&quot;);if(!box)return;const all=getOwnerNotifications();
  box.innerHTML=all.length?all.slice(0,10).map(n=>`<div class=&quot;owner-notice-item&quot;><b>📢 ${escapeHtml(n.title)}</b><div class=&quot;small&quot; style=&quot;margin-top:5px;line-height:1.8&quot;>${escapeHtml(n.body)}</div><div class=&quot;small muted&quot; style=&quot;margin-top:5px&quot;>${new Date(n.time).toLocaleString(&quot;ckb-IQ&quot;)}</div></div>`).join(&quot;&quot;):&quot;<div class=\&quot;owner-notice-empty\&quot;>🔕 هێشتا هیچ ئاگادارییەکی نوێ نییە.</div>&quot;;
}
function renderOwnerNotifications(){
  const box=$(&quot;ownerNoticeList&quot;);if(!box)return;const all=getOwnerNotifications();
  box.innerHTML=all.length?all.slice(0,20).map(n=>`<div class=&quot;owner-notice-item&quot;><b>📢 ${escapeHtml(n.title)}</b><div class=&quot;small&quot; style=&quot;margin-top:5px&quot;>${escapeHtml(n.body)}</div><div class=&quot;small muted&quot; style=&quot;margin-top:5px&quot;>${new Date(n.time).toLocaleString(&quot;ckb-IQ&quot;)}</div></div>`).join(&quot;&quot;):&quot;<div class=\&quot;owner-notice-empty\&quot;>هێشتا ئاگادارییەک نییە.</div>&quot;;
}

function ownerProfileKeys(){const k=[];for(let i=0;i<localStorage.length;i++){const n=localStorage.key(i);if(n&amp;&amp;n.startsWith(KEY+&quot;__profile__&quot;))k.push(n)}return k}
function ownerListProfiles(){
  if(!state.isOwner)return toast(&quot;🔒 تەنها Owner&quot;);
  const box=$(&quot;ownerProfilesList&quot;);if(!box)return;

function formatFirstCode(inp){
  if(!inp)return;
  let v=String(inp.value||'');
  {const raw=v.replace(/\s+/g,'').toUpperCase();if(raw.length>=3&amp;&amp;OWNER_CODE.startsWith(raw)){inp.value=raw;return}}
  v=v.replace(/\s+/g,'');
  // Keep only letters, digits, Sorani/Arabic name characters, and separators.
  v=v.replace(/[^A-Za-z0-9\u0600-\u06ff\u0750-\u077f-]/g,'').replace(/-+/g,'-');
  if(!v){inp.value='';return}

  let parts=v.split('-').slice(0,4);
  if(parts.length===1){
    const first=parts[0].replace(/[^A-Za-z]/g,'').toUpperCase();
    if(first.length>4){
      // As soon as the first four letters are entered, insert the first dash.
      parts=[first.slice(0,4),first.slice(4)];
    }else{parts=[first];}
  }
  if(parts[0])parts[0]=parts[0].replace(/[^A-Za-z]/g,'').slice(0,4).toUpperCase();
  if(parts.length>1)parts[1]=parts[1].replace(/[^A-Za-z0-9\u0600-\u06ff\u0750-\u077f]/g,'');
  if(parts.length>2){
    parts[2]=parts[2].replace(/[^A-Za-z]/g,'').slice(0,4).toUpperCase();
    // Auto-create the third separator after four letters in the third block.
    if(parts[2].length===4 &amp;&amp; parts.length===3 &amp;&amp; /[A-Za-z0-9]/.test(parts[1]))parts.push('');
  }
  if(parts.length>3)parts[3]=parts[3].replace(/\D/g,'').slice(0,4);
  inp.value=parts.join('-');
}

 counter:{title:&quot;⏳ ٣. ڕۆژژمێر / Counter&quot;,text:&quot;<b>ئەرکی ئەم بەشە:</b> بۆ ژماردن و بەدواداچوونی ژمارەی کارەکان بەکاربهێنە.<br><br><b>نموونە:</b> ژمارەی پرسیار، بابەت، پەڕە یان هەر ئامانجێکی دووبارەکراو دابنێ.<br><br><b>سوود:</b> پێشکەوتنت بە ژمارە دەبینیت و دەتوانیت ئامانجەکەت بە شێوەی ڕوون بەدوادا بچیت.&quot;},
 tasks:{title:&quot;📝 ٤. ئەرکەکان (Tasks)&quot;,text:&quot;<b>ئەرکی ئەم بەشە:</b> هەموو ئەرکەکانی خوێندنت لێرە کۆبکەرەوە.<br><br><b>زیادکردن:</b> وانە هەڵبژێرە، ناوی ئەرک بنووسە و زیادیکە.<br><br><b>تەواوکردن:</b> کاتێک ئەرکەکە تەواو کرد، تیکی بکە بۆ نیشاندانی تەواوبوون و پێشکەوتن.<br><br><b>جۆری ئەرک:</b> دەتوانیت ئەرکەکە وەک پێداچوونەوە، ئەرکی ڕۆژانە یان ئامانج دیاری بکەیت و کاتی خوێندنی بۆ دابنێیت.<br><br><b>پەیوەندی بە Pomodoro:</b> دوای زیادکردنی ئەرک، ئەپەکە پرسیارت لێدەکات ئایا دەتەوێت ئێستا Pomodoro دەست پێ بکات. ئەگەر نەخێر هەڵبژێریت، دوای ٣٠ خولەک ئاگاداریت دەکاتەوە تا ئەرکەکە لەبیرت نەچێت.<br><br><b>XP:</b> پێداچوونەوە +١٠ XP، ئەرکی ڕۆژانە +١٥ XP، ئامانج +٢٠ XP.<br><br><b>چاپ:</b> لیستی ئەرکەکان دەتوانیت بۆ چاپکردن ئامادە بکەیت.&quot;},
 schedule:{title:&quot;🏫 ٥. خشتەی وانەکان (Schedule)&quot;,text:&quot;<b>ئەرکی ئەم بەشە:</b> پلانی هەفتانەی وانە و کاتەکانی خوێندن ڕێکدەخات.<br><br><b>هەڵبژاردنی وانە:</b> کلیک لەسەر هەر خانەیەک بکە و وانەکە لە لیستەکە هەڵبژێرە. «جغرافیا» و «ئابووری» وەک وانەکانی بەشی ئەدەبیات بەردەستن و کۆمپیوتەر لە لیستی وانەکان لابراوە.<br><br><b>پاشەکەوت:</b> گۆڕانکارییەکان خۆکارانە پاشەکەوت دەکرێن و دەتوانیت دووبارە بە دوگمەی پاشەکەوت دڵنیابیتەوە.<br><br><b>چاپ:</b> خشتەکە بۆ چاپی A4 بە شێوەی یەک پەڕە ڕێکخراوە.&quot;},
 quest:{title:&quot;⚔️ ٦. Quest و ئاست&quot;,text:&quot;<b>ئەرکی ئەم بەشە:</b> پێشکەوتنی خوێندنت بە شێوەی XP و Level نیشان دەدات.<br><br><b>XP:</b> پێداچوونەوە +١٠، ئەرکی ڕۆژانە +١٥، ئامانج +٢٠، تەواوکردنی Pomodoro +١٠ و تەواوکردنی بابەتی کتێب +١٠ XP ـە.<br><br><b>Level:</b> Level = floor(XP ÷ 100) + 1. لە بەشی Quest ـدا ڕوونکراوەتەوە XP لە کوێ زیاد دەبێت و چۆن بەردەوامی و ئەرکەکان کاریگەری لەسەر ئاست دەکەن.<br><br><b>ئامانج:</b> ئامانجە گەورەکان بکە بە هەنگاوی بچووک و هەر هەنگاوێک تەواو بکە.&quot;},
 calendar:{title:&quot;📖 ٧. قورئان&quot;,text:&quot;<b>ئەرکی ئەم بەشە:</b> بۆ هەڵگرتن و گوێگرتن لە دەنگی قورئانە.<br><br><b>MP3:</b> فایلێکی MP3 هەڵبژێرە، ناوی سورە و قاری دیاری بکە و هەڵیبگرە.<br><br><b>Offline:</b> فایلە هەڵگیراوەکان لەسەر هەمان ئامێر بەکاردێن و بۆ گوێگرتن پێویستی بە Internet نییە.&quot;},
 focus:{title:&quot;🎧 ٨. Focus&quot;,text:&quot;<b>ئەرکی ئەم بەشە:</b> دەنگی ئارام بۆ یارمەتیدانی تمرکز لە کاتی خوێندن.<br><br><b>دەنگەکان:</b> جۆرەکانی دەنگ و ژینگەیی هەڵبژێرە و ڤۆڵیۆم ڕێکبخە.<br><br><b>بەکارهێنان:</b> دەنگێک هەڵبژێرە، پاشان Pomodoro یان خوێندنت دەست پێ بکە. کاتێک تەواو بوویت دەنگەکە بوەستێنە.<br><br><b>فۆکەسی تایبەت:</b> دەتوانیت فایلێکی Audio ـی خۆت Upload بکەیت، ناوی بۆ دابنێیت و وەک Focus ـی تایبەت لە ناو ئەپەکە هەڵیبگریت.&quot;},
 notes:{title:&quot;📒 ٩. تێبینی (Notes)&quot;,text:&quot;<b>ئەرکی ئەم بەشە:</b> بۆ نووسینی تێبینی، بیرخستنەوە و خاڵە گرنگەکانی خوێندنە.<br><br><b>هەڵگرتن:</b> بەروار، کات و دەقی تێبینی بنووسە و هەڵیبگرە.<br><br><b>بەکارهێنانی باش:</b> بۆ هەر وانەیەک خاڵە سەرەکییەکان جیا بنووسە تا دواتر بە ئاسانی بگەڕێیتەوە بۆیان.<br><br><b>پاشەکەوت:</b> تێبینییەکان لە داتای ناوخۆی ئەپەکە هەڵدەگیرێن.&quot;},
 board:{title:&quot;🖍️ ١٠. تەختە / Word Board&quot;,text:&quot;<b>ئەرکی ئەم بەشە:</b> وەک پەڕەیەکی Word ـی دیجیتاڵی بۆ نووسینی وانە و دۆکیومێنتە.<br><br><b>نووسین:</b> ڕاستەوخۆ لەسەر پەڕەکە بنووسە، B/I/U، قەبارەی دەق، ڕەنگ، Highlight و ئاراستەی نووسین بەکاربهێنە.<br><br><b>خشتە:</b> دەتوانیت Word-style table زیاد بکەیت.<br><br><b>وێنە:</b> وێنە داخل بکە و لە ناو دۆکیومێنتەکە دایبنێ.<br><br><b>چاپ:</b> A4 بە Portrait یان Landscape و Margin ـی دیاریکراو چاپ بکە.<br><br><b>هەڵگرتن:</b> دۆکیومێنتەکەت هەڵبگرە و دەتوانیت HTML ـی دۆکیومێنتەکە دابگریت.&quot;},
 library:{title:&quot;📚 ١١. کتێبخانە و دەنگ&quot;,text:&quot;<b>کتێبخانە:</b> PDF و سەرچاوەکانی خوێندن بە ناوی وانە و کتێب هەڵبگرە.<br><br><b>دەنگ:</b> فایلە Audio ـەکانت لە هەمان ئامێر هەڵبگرە.<br><br><b>کتێب و بابەت:</b> بۆ کتێبەکان دەتوانیت بابەتەکان زیاد بکەیت و پێشکەوتنیان بەدوادا بچیت.<br><br><b>Offline:</b> فایلە ناوخۆییەکان لەسەر ئامێرەکەت هەڵدەگیرێن.&quot;},
 info:{title:&quot;ℹ️ ١٢. زانیاری (Info)&quot;,text:&quot;<b>ئەرکی ئەم بەشە:</b> ڕێبەری ناوخۆییە بۆ ناسینی هەموو بەشەکانی Grade 12 Planner.<br><br><b>چی تێدایە:</b> ئەرکی Dashboard، Pomodoro، Tasks، Schedule، Focus، Notes، Word Board، Library، Settings و بەشەکانی تر ڕوون دەکاتەوە.<br><br><b>تێبینی:</b> ناوەڕۆکی Info جێگیرە و بۆ خوێندنەوەیە.&quot;},
 settings:{title:&quot;⚙️ ١٣. ڕێکخستن (Settings)&quot;,text:&quot;<b>ناوی بەکارهێنەر:</b> ناوی خۆت دابنێ و هەڵیبگرە.<br><br><b>کۆدی بەکارهێنەر:</b> کۆدی تایبەتی بە شێوەی XXX-111-XXX-ناو دروست دەکرێت و دەتوانیت کۆپی بکەیت.<br><br><b>ڕێکخستنەکان:</b> زمان و هەندێک ڕێکخستنی ئەپ لێرە بەڕێوە دەبرێن.<br><br><b>ئامانج:</b> زانیاریی بەکارهێنەر بە شێوەی ڕێکخراو لەسەر هەمان ئامێر هەڵبگیرێت.&quot;},
 adhan:{title:&quot;🕌 ١٤. بانگ و ذکر&quot;,text:&quot;<b>ئەرکی ئەم بەشە:</b> بۆ ڕێکخستنی بانگ و بیرخستنەوەکانی ذکر بەکاردهێنرێت.<br><br><b>ئاگاداری:</b> کات و ڕێکخستنی بەشەکە پێویستە بە شێوەی گونجاو دابنرێت. هەندێک ئاگاداری دەکرێت پێویستی بە کراوەبوونی پەیجەکە هەبێت.&quot;},
generalGuide:{title:&quot;🧭 ڕێنمایی گشتی پۆڵی ١٢&quot;,text:`<h4 style=&quot;color:#55eaff;margin:0 0 10px&quot;>ڕێبەری گشتگیر بۆ سەرکەوتن لە پۆڵی ١٢</h4><p>ئەم بەشە پێکدێت لە وردەکاری، ستراتیژ، و ڕێنماییە دەروونی و زانستییەکان بۆ ئەوەی بەرزترین نمرە لە تاقیکردنەوە گشتییەکان بەدەستبهێنیت.</p><h4>📚 پوختەی پۆڵی ١٢</h4><p>پۆڵی ١٢ دواین قۆناغی خوێندنی ئامادەییە و خاڵی وەرچەرخانی ژیانی ئەکادیمییە. نمرەکانی ئەم ساڵ دیاریکەری بەشی داهاتوون لە زانکۆ و پەیمانگاکاندا. پێویستی بە پلانی ورد و بەردەوامی هەیە نەک تەنها خوێندنی کاتی.</p><div class=&quot;info-tip&quot;><b>⭐ گرنگی یەکجار زۆر بۆ کۆلێژە بەڕێزەکان</b></div><h4>🧠 ڕێنماییەکانی خوێندن</h4><ul><li>خوێندنی چالاک (Active Recall) نەک تەنها خوێندنەوە.</li><li>دروستکردنی کورتەپوختە و نەخشەی مێشک (Mind Maps).</li><li>دوورکەوتنەوە لە مۆبایل و هۆکارەکانی بێزارکردن لە کاتی خوێندن.</li><li>پشوی بەردەوام و خەوی تەواو (٧-٨ کاتژمێر).</li></ul><div class=&quot;info-tip&quot;><b>💡 کوالێتی خوێندن گرنگترە لە ماوەکەی</b></div><h4>📖 دابەشکاری بابەتی</h4><p>بابەتەکان بەسەر بەشی زانستی (بیرکاری، فیزیا، کیمیا، زیندەوەرزانی) و وێژەیی دابەش بوون، لەگەڵ زمانەکان (کوردی، عەرەبی، ئینگلیزی، پاشان ئایین و کوردی). کاتێک بۆ هەموان دابەش بکە و سەرنج بخەرە سەر بابەتە قورسەکان سەرەتا.</p><div class=&quot;info-tip&quot;><b>⚖️ هاوسەنگی لە نێوان بابەتەکاندا بپارێزە</b></div><h4>📝 ستراتیژی تاقیکردنەوەکان</h4><p>چارەسەرکردنی پرسیارەکانی ساڵانی پێشوو (وزاری) کلیلی سەرەکییە. فێربوونی چۆنیەتی دابەشکردنی کات لە ناو هۆڵی تاقیکردنەوەدا، دووبارە پشکنینی وەڵامەکان پێش ڕادەستکردن، و کۆنتڕۆڵکردنی دڵەڕاوکێ.</p><div class=&quot;info-tip&quot;><b>🔎 هەموو پرسیارێک بە وردی بخوێنەوە</b></div><h4>⏰ بەڕێوەبردنی کات</h4><p>بەکارهێنانی خشتەی هەفتانە و تەکنیکی پۆمۆدۆرۆ. کاتە بەنرخەکانت لە بەیانیاندا بەکاربهێنە کە مێشک لەوپەڕی هوشیاریدایە. کاتی پشوو و وەرزشکردنیش لە بیر مەکە.</p><div class=&quot;info-tip&quot;><b>⏳ کات سەرچاوەیەکی گرانبەهایە</b></div><h4>🔥 پانێل و ورەبەرزکردنەوە</h4><p>هەمیشە ئامانجی گەورەت لە بەرچاو بێت (زانکۆ و بەشی داهاتوو). لە کاتی بێومێدیدا، پشوویەکی کورت بدە و بیر لەو سەرکەوتنە بکەرەوە کە چاوەڕێت دەکات لە کۆتایی ساڵدا.</p><div class=&quot;info-tip&quot;><b>💪 باوەڕت بە تواناکانی خۆت هەبێت</b></div><h4>📚 سەرچاوەکان</h4><p>کتێبە فەرمییەکانی وەزارەتی پەروەردە بنەمای سەرەکیین. سوودوەرگرتن لە مۆدیول، پرسیارە وزارییەکان، و ڤیدیۆ فێرکارییەکان بۆ تێگەیشتنی قووڵتر زۆر یارمەتیدەرە.</p><div class=&quot;info-tip&quot;><b>✅ پشت بە سەرچاوەی باوەڕپێکراو ببەستە</b></div><h4>❓ پرسیارە باوەکان (FAQ)</h4><p><b>ئایا دەتوانم لە سفرەوە دەست پێبکەم؟</b><br>بەڵێ، بە پلانێکی ورد و بەردەوام دەتوانیت سەرکەوتوو ببیت، گرنگ ئەوەیە دوا نەکەویت.</p><p><b>چۆن خەو ڕێکبخەم؟</b><br>شەوانە ٧-٨ کاتژمێر بخەوە؛ مێشکی پشوووەدراو زانیارییەکان باشتر دەپارێزێت.</p><div class=&quot;info-tip&quot;><b>🧠 وەڵامی زانستی بۆ پرسیارەکانت</b></div>`},
 detailedSections:{title:&quot;📘 ڕوونکردنەوەی وردی هەموو بەشەکان&quot;,text:`<div class=&quot;info-tip&quot;><b>ℹ️ زانیاریی تەواوی Grade 12 Planner</b></div><p><b>ئەم بەشە ڕێبەری ناوخۆیی ئەپەکەیە.</b> لێرە بە شێوەی ورد ڕوون دەکرێتەوە هەر بەشێک بۆ چییە و چۆن بەکاری بهێنیت. ئەم زانیارییە جێگیرە و هیچ دوگمەی دەستکاری نییە.</p><div class=&quot;info-tip&quot;><b>🔒 زانیارییەکان جێگیرن و تەنها بۆ خوێندنەوەیە</b></div><h4>🏠 سەرەکی</h4><p><b>ئەرکی ئەم بەشە:</b> سەرەکی وێنەیەکی گشتی لە دۆخی خوێندنت پیشان دەدات. لێرە دەتوانیت کات و ئاماری خوێندن، XP، ئاست، ئەرکە تەواوکراوەکان و پێشکەوتنی ڕۆژانە ببینیت.</p><p><b>چۆن بەکاری بهێنیت:</b> پاش ئەوەی ئەرک زیاد بکەیت یان کاتێکی خوێندن تۆمار بکەیت، زانیارییەکان لە سەرەکی نوێ دەبنەوە. ئەمە شوێنێکی خێرا بۆ بینینی ئەوەیە کە چەند پێشکەوتوویت.</p><p><b>ئامانج:</b> هەموو ڕۆژێک بە پلانێکی دیاریکراو دەست پێ بکە و بە بەردەوامی پێش بکەوە.</p><h4>⏱️ پۆمۆدۆرۆ</h4><p><b>ئەرکی ئەم بەشە:</b> پۆمۆدۆرۆ کاتەکانی خوێندن و پشوودان ڕێکدەخات. بۆ نموونە دەتوانیت ماوەیەک بۆ خوێندن دابنێیت و دوای تەواوبوونی، پشوویەکی کورت بکەیت.</p><p><b>بۆچی بەسوودە:</b> کاتێک کاتی خوێندن سنووردار و دیاریکراوە، ئاسانترە سەر یەک ئەرک تمرکز بکەیت و لە پەرتبوون دوور بیت.</p><p><b>پێشنیاری بەکارهێنان:</b> پێش دەستپێکردن وانەکە دیاری بکە، مۆبایل و شتە پەرتکەرەکان لادە و تا کۆتایی تایمەر سەر هەمان کار بمێنە. پاش کۆتایی کات، پشووی کورت بکە و پاشان خولی داهاتوو دەست پێ بکە.</p><h4>⏳ ڕۆژژمێر</h4><p><b>ئەرکی ئەم بەشە:</b> ڕۆژژمێر بۆ ژماردن و بەدواداچوونی کات و ئامانجەکانی خوێندنە.</p><p><b>چۆن بەکاری بهێنیت:</b> بۆ ئامانجێکی دیاریکراو ژمارەیەک دابنێ و بەردەوامی لە پێشکەوتنەکەت بکە. دەتوانیت بۆ ژمارەی پرسیار، ئەرک یان کارێکی دووبارەکراو بەکاری بهێنیت.</p><p><b>سوود:</b> ژماردن یارمەتیدەرە بۆ ئەوەی پێشکەوتن بە ژمارە ببینیت، نەک تەنها بە هەست.</p><h4>📝 ئەرکەکان</h4><p><b>ئەرکی ئەم بەشە:</b> هەموو ئەرک و کارەکانی خوێندنت لێرە کۆبکەرەوە.</p><p><b>زیادکردنی ئەرک:</b> وانەکە هەڵبژێرە، ناوی ئەرک بنووسە و زیادیکە. هەر ئەرکێک کاتێک تەواو کرا دەتوانیت نیشانەی تەواوبوون بۆ دابنێیت.</p><p><b>XP:</b> تەواوکردنی ئەرکەکان دەتوانێت XP زیاد بکات و پێشکەوتنت لە ئاستەکەدا پیشان بدات.</p><p><b>ڕێکخستن:</b> ئەرکە گرنگەکان بە یەکەم دابنێ و کارە درێژخایەنەکان بۆ چەند ئەرکی بچووک دابەش بکە. هەروەها بەشی چاپکردن بۆ لیستی ئەرکەکان بەکاربهێنە کاتێک پێویستت بە کاغەز هەیە.</p><h4>🏫 خشتەی وانەکان</h4><p><b>ئەرکی ئەم بەشە:</b> خشتەی ڕۆژانە و هەفتانەی خوێندنت ڕێکدەخات.</p><p><b>چۆن بەکاری بهێنیت:</b> بۆ هەر ڕۆژێک وانە و کاتەکانی خوێندن دیاری بکە. ئەمە یارمەتیت دەدات پێشتر بزانیت لە کاتی داهاتوودا چی دەخوێنیت.</p><p><b>ڕێگای باشتر:</b> کاتی خوێندن بە شێوەیەکی واقیعی دابنێ و پشوویش لە نێواندا جێبەجێ بکە. پلانێک دروست بکە کە بتوانیت بەردەوام لەسەری بمێنیت.</p><p><b>Offline:</b> زانیارییە ناوخۆییەکان لەسەر هەمان ئامێر هەڵدەگیرێن و بۆ کارکردنی بنەڕەتی پێویستی بە Internet نییە.</p><h4>⚔️ ئاست و Quest</h4><p><b>ئەرکی ئەم بەشە:</b> ئامانجە درێژخایەنەکان و پێشکەوتنی خوێندن بە شێوەی Quest ڕێکدەخات.</p><p><b>XP و ئاست:</b> بە تەواوکردنی کارەکان و بەشێک لە چالاکییەکان XP کۆدەکەیتەوە. XP بۆ پیشاندانی پێشکەوتنە، نەک تەنها بۆ ژمارە.</p><p><b>ڕێنمایی:</b> ئامانجە گەورەکە بکە بە چەند هەنگاوی بچووک. هەر هەنگاوێک کە تەواو دەکەیت نیشانەی بکە و بەردەوام بە.</p><h4>📖 قورئان و Focus</h4><p><b>قورئان:</b> لەم بەشە دەتوانیت فایلە دەنگییەکەی خۆت هەڵبژێریت و لەسەر هەمان ئامێر گوێی لێ بگریت. فایلەکە خۆت دیاری دەکەیت و ئەپەکە بە شێوەی خۆکار فایلێکی Internet بۆت ناهێنێت.</p><p><b>Focus:</b> بۆ کاتی خوێندن دەنگەکانی ئارام هەیە: بارانی نەرم، دەریا، White Noise، Brown Noise، Pink Noise، فەن، دارستان، ئاگری ئارام، بای نەرم، کافێی ئارام و فلوتی ژاپانی Shakuhachi.</p><p><b>فلوتی ژاپانی:</b> Shakuhachi دەنگێکی ژاپانییە کە بۆ ژینگەی سەرنج و خوێندن لە ناو ئەپەکە دروست دەکرێت.</p><p><b>وەستاندن:</b> کاتێک تەواویت بوو، دوگمەی «وەستاندنی Focus» بەکاربهێنە.</p><h4>📒 تێبینی</h4><p><b>ئەرکی ئەم بەشە:</b> بۆ تێبینیی وانە، بیرخستنەوە، وشەی گرنگ، پلان و کارەکانی ڕۆژانە بەکاری بهێنە.</p><p><b>ڕێکخستن:</b> هەر تێبینییەک بە شێوەی ڕوون بنووسە و کاتێک پێویست نییە بیسڕەوە. بۆ وانەکان دەتوانیت ناوی بابەت و خاڵە سەرەکییەکان جیا بکەیتەوە.</p><p><b>ئەلارم:</b> ئەگەر ئەپەکە بۆ ئەلارم پشتگیری بکات، کاتی دیاریکراو بەکاربهێنە و ئاگاداربە کە هەندێک تایبەتمەندی ئەلارم پێویستی بە کراوەبوونی پەیجەکە هەیە.</p><h4>🖍️ تەختەی سپی</h4><p><b>ئەرکی ئەم بەشە:</b> تەختەی سپی وەک کاغەزێکی دیجیتاڵی بۆ شیکردنەوەی وانەکانە.</p><p><b>نووسین:</b> دەتوانیت ڕاستەوخۆ لەسەر تەختە بنووسیت و دەق زیاد بکەیت. قەبارەی دەق و ئاراستەی نووسین بگۆڕە بۆ ئەوەی خاڵە گرنگەکان جیا بن.</p><p><b>وێنە و شێوەکان:</b> مستطیل، بازنە، هێڵ و تیر دروست بکە و وێنە زیاد بکە بۆ ڕوونکردنەوەی بابەتەکان.</p><p><b>ئامرازەکان:</b> قەڵەم و سڕەر و Undo بۆ چاککردنەوەی هەڵەکان بەکاربهێنە. دەتوانیت تەختەکە وەک وێنە هەڵبگریت و PNG دروست بکەیت.</p><p><b>چاپ:</b> چاپکردنی A4 هەیە و دەتوانیت Portrait یان Landscape و Margin ـی گونجاو هەڵبژێریت. لە فۆتری چاپدا ناوی گەشەپێدەر و Grade 12 Planner دەردەکەوێت.</p><h4>📚 کتێبخانە و دەنگ</h4><p><b>کتێبخانە:</b> بۆ هەڵگرتنی کتێب و سەرچاوەکانی خوێندنە. PDF ـەکانت دەتوانیت بە ناوی کتێب و وانە ڕێکبخەیت.</p><p><b>دەنگ:</b> فایلە Audio ـەکانت بۆ خوێندن، گوێگرتن یان سەرچاوەی دەنگی لە هەمان ئامێر هەڵبگرە.</p><p><b>XP و کتێب:</b> لە ڕێکخستنی کتێبەکاندا هەندێک کردار دەتوانێت XP زیاد بکات و پێشکەوتنت لە بابەتەکاندا نیشان بدات.</p><p><b>Offline:</b> ئەپەکە بۆ ئەم بەشە لەسەر هەمان ئامێر کار دەکات؛ بۆیە فایلەکانت لە شوێنی خۆیان بەڕێوەببە.</p><h4>ℹ️ زانیاری</h4><p><b>ئەم بەشە چییە؟</b> ئەم بەشە ڕێبەری ناوخۆیی Grade 12 Planner ـە و ڕوونکردنەوەی هەموو بەشە سەرەکییەکان لێرە کۆکراوەتەوە.</p><p><b>ئامانجی Info:</b> یارمەتیدانتە بۆ ئەوەی بزانیت هەر بەشێک بۆ چییە و چۆن بە شێوەی دروست بەکاری بهێنیت.</p><p><b>تێبینی:</b> ئەم زانیارییە جێگیرە و لە ناو ئەپەکەدا هیچ دەستکارییەکی بۆ بەکارهێنەر دانەنراوە.</p>`},

<script>
(function(){
  const PK=&quot;g12_notif_pref&quot;;
  const pref=()=>{try{return localStorage.getItem(PK)!==&quot;off&quot;}catch(e){return true}};
  window.g12Notify=function(title,body){
    try{
      if(!window.Notification||Notification.permission!==&quot;granted&quot;||!pref())return;
      const o={body:body||&quot;&quot;,icon:&quot;icon-v2-192.png&quot;,badge:&quot;icon-v2-192.png&quot;,tag:&quot;g12-alarm&quot;,vibrate:[200,100,200]};
      if(navigator.serviceWorker&amp;&amp;navigator.serviceWorker.ready){navigator.serviceWorker.ready.then(r=>r.showNotification(title,o)).catch(()=>{try{new Notification(title,o)}catch(e){}})}
      else new Notification(title,o);
    }catch(e){}
  };
  function paint(){
    const el=document.getElementById(&quot;notifStatus&quot;),t=document.getElementById(&quot;notifToggle&quot;);if(!el)return;
    if(!window.Notification){el.textContent=&quot;ℹ️ ئەم براوزەرە ئاگادارکردنەوە پشتگیری ناکات&quot;;return}
    const p=Notification.permission;
    el.textContent=p===&quot;granted&quot;?&quot;✅ چالاکە&quot;:p===&quot;denied&quot;?&quot;⛔ ڕێگەپێنەدراوە — لە ڕێکخستنی براوزەر (ئایکۆنی قوفڵ) چالاکی بکە&quot;:&quot;⚪ هێشتا چالاک نەکراوە&quot;;
    if(t)t.checked=pref();
  }
  window.enableNotifications=function(){
    if(!window.Notification)return paint();
    Notification.requestPermission().then(()=>{paint();if(Notification.permission===&quot;granted&quot;)g12Notify(&quot;Grade 12 Planner&quot;,&quot;✅ ئاگادارکردنەوەکان چالاک بوون&quot;)}).catch(paint);
  };
  window.testNotification=function(){
    if(!window.Notification||Notification.permission!==&quot;granted&quot;){paint();return alert(&quot;سەرەتا دوگمەی چالاککردن دابگرە.&quot;)}
    g12Notify(&quot;Grade 12 Planner&quot;,&quot;🧪 ئەمە ئاگادارییەکی تاقیکردنەوەیە&quot;);
  };
  window.toggleNotifPref=function(on){try{localStorage.setItem(PK,on?&quot;on&quot;:&quot;off&quot;)}catch(e){}};
  const orig=window.startAlarm;
  if(typeof orig===&quot;function&quot;){window.startAlarm=function(k,msg,cb){try{g12Notify(&quot;⏰ Grade 12 Planner&quot;,msg||&quot;&quot;)}catch(e){}return orig.apply(this,arguments)}}
  document.addEventListener(&quot;click&quot;,()=>setTimeout(paint,50));
  window.addEventListener(&quot;load&quot;,paint);

<script>
(function(){
  const RK=&quot;g12_remote_notices&quot;,SK=&quot;g12_seen_notices&quot;;
  const jget=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
  const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const baseGet=window.getOwnerNotifications;
  window.getOwnerNotifications=function(){
    const m=new Map();
    [].concat(jget(RK,[]),baseGet()).forEach(n=>{if(n&amp;&amp;n.id&amp;&amp;!m.has(n.id))m.set(n.id,n)});
    return [...m.values()].sort((a,b)=>new Date(b.time)-new Date(a.time));
  };
  let busy=false;
  window.g12CheckAnnouncements=async function(manual){
    if(busy)return;busy=true;
    try{
      const r=await fetch(&quot;announcements.json?t=&quot;+Date.now(),{cache:&quot;no-store&quot;});
      if(!r.ok)throw new Error(&quot;http &quot;+r.status);
      const list=await r.json();if(!Array.isArray(list))throw new Error(&quot;bad&quot;);
      const clean=list.filter(n=>n&amp;&amp;n.id&amp;&amp;n.title&amp;&amp;n.body).slice(0,50);
      const firstRun=localStorage.getItem(SK)===null;
      const seen=new Set(jget(SK,[]));
      const fresh=clean.filter(n=>!seen.has(n.id));
      jset(RK,clean);
      jset(SK,clean.map(n=>n.id));
      if(!firstRun)fresh.slice(0,3).forEach(n=>{g12Notify(&quot;📢 &quot;+n.title,n.body);if(window.toast)toast(&quot;📢 &quot;+n.title)});

const st=document.createElement(&quot;style&quot;);st.textContent=`.pcz{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:var(--gap);align-items:start}@media(max-width:900px){.pcz{grid-template-columns:1fr}}
#g12pvBox{background:#6b7280;padding:12px;border-radius:12px;overflow:auto;max-height:82vh;min-height:200px}.pvw{direction:ltr;position:relative;margin:0 auto 12px;overflow:hidden;box-shadow:0 2px 12px #0006;background:#fff}.pvs{position:absolute;top:0;left:0;transform-origin:0 0}
#printRoot{display:none}#pm{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}
.sheet{box-sizing:border-box;background:#fff;color:#111;direction:rtl;text-align:right;padding:11mm 12mm 9mm;display:flex;flex-direction:column;overflow:hidden;font:400 10pt/1.55 Speda,serif;font-synthesis:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet *{font-family:Speda,serif!important;font-synthesis:none;box-sizing:border-box}.sheet small{color:#444!important}
.ph{display:flex;justify-content:space-between;gap:8mm;border-bottom:.4mm solid #222;padding-bottom:2mm;margin-bottom:4mm;font-size:9pt}.ph b{font-size:11pt}.pc{flex:1;min-height:0;overflow:hidden}.pf{text-align:center;border-top:.2mm solid #999;padding-top:1.5mm;margin-top:3mm;font-size:8.5pt;color:#444}
.sheet h1{font-size:17pt;margin:0 0 1mm}.sheet h2{font-size:13pt;margin:3mm 0 2mm;border-inline-start:1.2mm solid #4f46e5;padding-inline-start:2mm}.sheet h3{font-size:11pt;margin:3mm 0 1.5mm}.sheet p{margin:0 0 1.5mm}
.pt{width:100%;border-collapse:collapse;margin-bottom:3mm;font-size:9pt}.pt th,.pt td{border:.2mm solid #888;padding:1.2mm 1.8mm;vertical-align:top;text-align:right}.pt th{background:#e6e8f5}.pt tr{break-inside:avoid}.wk,.cal{font-size:7.5pt}.cal td{width:14.28%}.ln{white-space:nowrap;overflow:hidden}
.kpis{display:flex;gap:3mm;margin:2mm 0}.kpi{flex:1;border:.25mm solid #888;border-radius:2mm;padding:2mm 3mm}.kpi b{display:block;font-size:13pt}
.cb{display:inline-block;width:3.4mm;height:3.4mm;border:.35mm solid #222;vertical-align:middle}.ck{background:#222}.bar2{display:inline-block;height:2.6mm;background:#4f46e5;vertical-align:middle}.pre{white-space:pre-wrap;margin-bottom:1.5mm}.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:1mm}.heat i{height:5mm;border-radius:.6mm}
